public_ip_as_destination_ip: false
bind_host: 0.0.0.0

activity_logging:
  file:
    enabled: true
    session_csv_log_file: ""
    session_json_log_file: "/var/log/heralding/log_session.json"
    authentication_log_file: "/var/log/heralding/auth.csv"
  syslog:
    enabled: false
  hpfeeds:
    enabled: false
  curiosum:
    enabled: false

hash_cracker:
  enabled: false

capabilities:
  ftp:
    enabled: true
    port: 2121
    timeout: 30
    protocol_specific_data:
      max_attempts: 3
      banner: "(vsFTPd 3.0.5)"
      syst_type: "UNIX Type: L8"
  smtp:
    enabled: true
    port: 2525
    timeout: 30
    protocol_specific_data:
      banner: "mail.corp-relay.local ESMTP Postfix (Debian/GNU)"
      fqdn: ""
  pop3:
    enabled: true
    port: 2110
    timeout: 30
    protocol_specific_data:
      max_attempts: 3
      banner: "+OK POP3 server ready"
  imap:
    enabled: true
    port: 2143
    timeout: 30
    protocol_specific_data:
      max_attempts: 3
      banner: "* OK IMAP4rev1 Server Ready"
  telnet:
    enabled: false
  ssh:
    enabled: false
  http:
    enabled: false
  https:
    enabled: false
  postgresql:
    enabled: false
  mysql:
    enabled: false
  vnc:
    enabled: false
  socks5:
    enabled: false
  rdp:
    enabled: false
  pop3s:
    enabled: false
  imaps:
    enabled: false
  smtps:
    enabled: false
